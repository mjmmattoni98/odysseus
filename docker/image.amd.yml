# Optional image inference service. See docs/local-image-generation.md.
# Start only this service; the main Odysseus image needs no GPU dependencies.
# The listener stays up; Z-Image weights load on the first image request and
# are released after IMAGE_IDLE_TIMEOUT seconds without one (like Ollama).
services:
  image-generation:
    image: odysseus-image:rocm7.2
    build:
      context: .
      dockerfile: docker/image-amd.Dockerfile
    init: true
    user: "${PUID:-1000}:${PGID:-1000}"
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "${RENDER_GID:?Set RENDER_GID to the host render group ID}"
    volumes:
      - ${APP_DATA_DIR:-./data}/huggingface:/cache
    command:
      - --model
      - ${IMAGE_MODEL:-Tongyi-MAI/Z-Image-Turbo}
      - --host
      - 0.0.0.0
      - --port
      - "8110"
      - --allowed-host
      - image-generation
      - --dtype
      - bfloat16
      - --steps
      - "9"
      - --guidance-scale
      - "0"
      - --cpu-offload
      - --vae-slicing
      - --idle-timeout
      - "${IMAGE_IDLE_TIMEOUT:-300}"
    # No host-published port: only Odysseus's Compose network can reach it.
    # /health and /v1/models never load model weights.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8110/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      start_period: 2m
      retries: 3
    restart: unless-stopped
