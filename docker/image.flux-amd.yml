# Add to docker-compose.yml and docker/image.amd.yml to expose FLUX separately.
services:
  image-flux:
    extends:
      file: docker/image.amd.yml
      service: image-generation
    # extends rebases inherited relative paths to docker/. Keep these paths
    # relative to the checkout, matching the primary image service.
    build:
      context: .
      dockerfile: docker/image-amd.Dockerfile
    volumes:
      - ${APP_DATA_DIR:-./data}/huggingface:/cache
    command:
      - --model
      - black-forest-labs/FLUX.2-klein-4B
      - --host
      - 0.0.0.0
      - --port
      - "8111"
      - --allowed-host
      - image-flux
      - --dtype
      - bfloat16
      - --steps
      - "4"
      - --guidance-scale
      - "1"
      - --cpu-offload
      - --vae-slicing
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8111/v1/models', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      start_period: 30m
      retries: 3
